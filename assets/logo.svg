<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="ctGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12A594" />
      <stop offset="100%" stop-color="#008F83" />
    </linearGradient>
    <filter id="ctGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#008F83" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Medical Cross / Heart Pulse Shield Icon -->
  <g transform="translate(6, 6)" filter="url(#ctGlow)">
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#ctGrad)" />
    <!-- Subtle Inner Border -->
    <rect x="1" y="1" width="46" height="46" rx="13" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
    <!-- Pulse Line and Medical Cross Combo -->
    <path d="M14 24h6l2.5-6 5 12 4-8 2.5 4h6" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="37" cy="15" r="3" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Typography: CareTrack -->
  <text x="66" y="37" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#102D43" letter-spacing="-0.5">Care<tspan fill="#008F83">Track</tspan></text>
  <text x="68" y="49" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#71869A" letter-spacing="1.2">HEALTHCARE SYSTEM</text>
</svg>
